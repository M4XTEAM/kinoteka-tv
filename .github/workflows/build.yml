name: build-ipa
on:
  push:
  workflow_dispatch:

# NOTE: push the CONTENTS of ios-app/ as the repo root (so this file ends up at
# .github/workflows/build.yml and project.yml / KinotekaTV/ are at the root).
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project KinotekaTV.xcodeproj \
            -scheme KinotekaTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KinotekaTV-unsigned.ipa Payload
          ls -la KinotekaTV-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: KinotekaTV-unsigned-ipa
          path: KinotekaTV-unsigned.ipa
          if-no-files-found: error
