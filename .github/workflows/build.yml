name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project KinotekaTV.xcodeproj \
            -scheme KinotekaTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KinotekaTV-unsigned.ipa Payload
          ls -la KinotekaTV-unsigned.ipa
          cp KinotekaTV-unsigned.ipa "$RUNNER_TEMP/KinotekaTV-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: KinotekaTV-unsigned-ipa
          path: KinotekaTV-unsigned.ipa
          if-no-files-found: error

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest -y --cleanup-tag 2>/dev/null || true
          gh release create ipa-latest KinotekaTV-unsigned.ipa \
            --title "KinotekaTV unsigned IPA" \
            --notes "Автосборка ${GITHUB_SHA}" \
            --target "$GITHUB_SHA"

      - name: Commit IPA to ipa-bin branch (git-доставка)
        run: |
          git config user.email "ci@kinoteka"
          git config user.name "CI"
          git switch --orphan ipa-bin
          cp "$RUNNER_TEMP/KinotekaTV-unsigned.ipa" ./KinotekaTV-unsigned.ipa
          echo "IPA build of $GITHUB_SHA" > README.md
          git add KinotekaTV-unsigned.ipa README.md
          git commit -m "ipa build ${GITHUB_SHA}"
          git push -f origin ipa-bin
